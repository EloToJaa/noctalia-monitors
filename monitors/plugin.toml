# Monitors - display configuration for the Umbriel compositor.
#
# Umbriel pushes the output list (modes, position, scale, transform, ...) over
# its IPC event stream and has no runtime IPC action to change them. It does
# implement wlr-output-management, so the service applies changes with
# `wlr-randr` and keeps the previous layout around for a confirm-or-revert
# countdown.
#
# bar     -> monitor icon that opens the panel; shows the revert countdown
# panel   -> per-monitor editor: enable, resolution, refresh rate, scale,
#            rotation, position, variable refresh; layout preview
# layer   -> overlay that names each monitor on its own screen (Identify button)
# service -> `umbriel subscribe outputs` for state, `wlr-randr` for changes,
#            confirm/revert countdown

id = "elotoja/monitors"
name = "Monitors"
version = "0.1.0"
plugin_api = 45
author = "elotoja"
license = "MIT"
dependencies = ["umbriel", "wlr-randr"]
tags = ["umbriel", "panel", "display", "utility"]
icon = "device-desktop"
description = "Change monitor position, resolution, refresh rate, scale and rotation from a panel."

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "show_count"
  type = "bool"
  label_key = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default = false

# Control-center tile that opens the panel. Add it from Settings -> Control Center.
[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 800
placement = "floating"
position = "center"

[[service]]
id = "service"
entry = "service.luau"

# Names every monitor on its own screen for a few seconds. Lazy: it exists only
# while shown (the panel's Identify button).
[[layer]]
id = "identify"
entry = "identify.luau"
layer = "overlay"
anchors = []
exclusive_zone = -1
keyboard = "none"
click_through = true
output = "all"
